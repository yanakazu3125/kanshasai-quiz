<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運用者管理画面</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* 管理画面用の追加CSS */

      /* タイトル画像：左に操作、右にミニプレビュー */
      .title-image-layout {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .title-mini {
        margin: 0;
        width: min(360px, 100%);
      }
      /* 表示画面（16:9）の縮小版。配置は display.css のタイトル画面に合わせる */
      .title-mini-screen {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 6px;
        background: #04122e;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
      }
      .title-mini-screen video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .title-mini-screen img {
        position: absolute;
        height: auto;
      }
      .title-mini-logo {
        top: 50%;
        left: 50%;
        width: 64%;
        transform: translate(-50%, -55%);
      }
      .title-mini-super {
        right: 4%;
        bottom: 2%;
        width: 26%;
      }
      .title-mini-custom {
        left: 10%;
        bottom: 2%;
        max-width: 26%;
        max-height: 42%;
        width: auto;
        object-fit: contain;
      }
      .title-mini-custom[hidden] {
        display: none;
      }
      .title-mini figcaption {
        margin-top: 6px;
        font-size: 0.85em;
        color: #bbb;
        text-align: center;
      }
      body {
        background-color: #36393f;
      }
      .container {
        max-width: 800px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .header-info {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .logout-btn {
        padding: 8px 16px;
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }
      .logout-btn:hover {
        background: #c0392b;
      }
      .room-info {
        color: #61dafb;
        font-size: 14px;
      }
      #question-management {
        margin-top: 20px;
        padding: 15px;
        background-color: #4a4f5d;
        border-radius: 8px;
      }
      .question-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #5a5f6e;
      }
      .question-item:last-child {
        border-bottom: none;
      }
      .question-item span {
        flex-grow: 1;
        text-align: left;
      }
      .question-item button {
        margin-left: 10px;
        padding: 5px 10px;
        cursor: pointer;
      }
      #add-question-form {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        text-align: left;
      }
      #add-question-form input[type="text"] {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #5a5f6e;
        background-color: #3a3f4a;
        color: #f0f0f0;
      }
      #add-question-form button {
        padding: 10px 15px;
        background-color: #61dafb;
        color: #282c34;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .form-group {
        margin-bottom: 10px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      #current-quiz-status {
        margin-top: 20px;
        padding: 15px;
        background-color: #4a4f5d;
        border-radius: 8px;
        text-align: left;
      }
      #current-quiz-status p {
        margin-bottom: 5px;
      }
      #nickname-reset-controls {
        margin-top: 20px;
        padding: 15px;
        background-color: #4a4f5d;
        border-radius: 8px;
        text-align: center;
      }
      #nickname-reset-controls button {
        background-color: #f44336;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 1.1em;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }
      #nickname-reset-controls button:hover {
        background-color: #d32f2f;
      }
      #timer-settings {
        margin-top: 20px;
        padding: 15px;
        background-color: #4a4f5d;
        border-radius: 8px;
        text-align: left;
      }
      #timer-settings h2 {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>運用者管理画面</h1>
          <p id="admin-status">サーバーに接続中...</p>
        </div>
        <div class="header-info">
          <span class="room-info" id="roomIdDisplay">ルームID: 読み込み中...</span>
          <button id="openDisplayBtn" style="padding: 8px 16px; background: #61dafb; color: #282c34; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 10px;">
            表示画面を開く
          </button>
          <button class="logout-btn" id="logoutBtn">ログアウト</button>
        </div>
      </header>

      <div id="current-quiz-status">
        <h2>現在のクイズ状況</h2>
        <p>現在の接続中の参加者数: <span id="connected-users">0</span></p>
        <p>現在の問題: <span id="current-question-display">なし</span></p>
        <p>
          現在の問題インデックス: <span id="current-question-index">-1</span> /
          <span id="total-questions">0</span>
        </p>
        <p>クイズ状況: <span id="quiz-active-status">停止中</span></p>
      </div>

      <div id="timer-settings">
        <h2>タイマー設定</h2>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
          <label for="timerDuration">問題の制限時間（秒）:</label>
          <input
            type="number"
            id="timerDuration"
            min="1"
            max="300"
            value="10"
            style="width: 80px; padding: 5px; border-radius: 4px; border: 1px solid #5a5f6e; background-color: #3a3f4a; color: #f0f0f0;"
          />
          <button id="saveTimerBtn" style="padding: 5px 15px; background-color: #61dafb; color: #282c34; border: none; border-radius: 5px; cursor: pointer;">
            保存
          </button>
        </div>
        <p id="timer-status" style="margin-top: 10px; font-size: 0.9em; color: #bbb;"></p>
      </div>

      <div id="title-image-settings" style="margin-top: 20px; padding: 15px; background-color: #4a4f5d; border-radius: 8px; text-align: left;">
        <h2>タイトル画面の画像（左下）</h2>
        <p style="font-size: 0.9em; color: #bbb;">タイトル画面の左下に表示します。背景が透明なPNGがおすすめです。</p>
        <div class="title-image-layout">
          <div style="margin-top: 10px;">
            <label for="titleImageFile">画像ファイル:</label>
            <input id="titleImageFile" type="file" accept="image/*" style="margin-top: 5px; margin-bottom: 10px; display: block;" />
            <div style="margin-bottom: 12px;">
              <label style="cursor: pointer;">
                <input id="titleImageRemoveWhite" type="checkbox" />
                白い背景を透明にする
              </label>
              <div style="margin-top: 6px; font-size: 0.9em;">
                <label for="titleImageWhiteTolerance">抜く強さ:</label>
                <input id="titleImageWhiteTolerance" type="range" min="5" max="120" value="40" disabled style="vertical-align: middle;" />
              </div>
              <p style="margin: 4px 0 0; font-size: 0.8em; color: #bbb;">
                画像の外側から続く白だけを抜きます（内側の白は残ります）。白っぽい背景が残る時は強さを上げてください。
              </p>
            </div>
            <button id="uploadTitleImageBtn" style="padding: 5px 15px; background-color: #61dafb; color: #282c34; border: none; border-radius: 5px; cursor: pointer;">
              画像をアップロード
            </button>
            <p id="title-image-status" style="margin-top: 10px; font-size: 0.9em; color: #bbb;"></p>
            <div id="title-image-preview" style="margin-top: 10px; display: none;">
              <button id="removeTitleImageBtn" style="padding: 5px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">
                画像を削除
              </button>
            </div>
          </div>

          <!-- タイトル画面のミニプレビュー（表示画面と同じ配置） -->
          <figure class="title-mini">
            <div class="title-mini-screen">
              <video src="/title/bg-blue.mp4" autoplay loop muted playsinline></video>
              <img class="title-mini-logo" src="/title/logo.png" alt="" />
              <img class="title-mini-super" src="/title/super.png" alt="" />
              <img id="title-image-preview-img" class="title-mini-custom" alt="タイトル画面の画像" hidden />
            </div>
            <figcaption id="title-mini-caption">プレビュー（画像なし）</figcaption>
          </figure>
        </div>
      </div>

      <div id="nickname-reset-controls">
        <h2>参加者ニックネーム管理</h2>
        <button id="resetNicknamesBtn">参加者ニックネームをリセット</button>
      </div>

      <div id="question-management">
        <h2>問題管理</h2>
        <form id="add-question-form">
          <h3>新しい問題を追加</h3>
          <div class="form-group">
            <label for="questionText">問題文:</label>
            <input
              type="text"
              id="questionText"
              placeholder="問題文を入力"
              required
            />
          </div>
          <div class="form-group">
            <label for="optionA">選択肢 A:</label>
            <input type="text" id="optionA" placeholder="選択肢 A" required />
            <label>選択肢A 画像URL:</label>
            <input id="optionAImageUrl" type="text" placeholder="https://..." />
            <label>選択肢A 画像ファイル:</label>
            <input id="optionAImageFile" type="file" accept="image/*" />
            <label>選択肢A 動画URL:</label>
            <input id="optionAVideoUrl" type="text" placeholder="https://..." />
            <label>選択肢A 動画ファイル:</label>
            <input id="optionAVideoFile" type="file" accept="video/*" />
          </div>
          <div class="form-group">
            <label for="optionB">選択肢 B:</label>
            <input type="text" id="optionB" placeholder="選択肢 B" required />
            <label>選択肢B 画像URL:</label>
            <input id="optionBImageUrl" type="text" placeholder="https://..." />
            <label>選択肢B 画像ファイル:</label>
            <input id="optionBImageFile" type="file" accept="image/*" />
            <label>選択肢B 動画URL:</label>
            <input id="optionBVideoUrl" type="text" placeholder="https://..." />
            <label>選択肢B 動画ファイル:</label>
            <input id="optionBVideoFile" type="file" accept="video/*" />
          </div>
          <div class="form-group">
            <label for="optionC">選択肢 C:</label>
            <input type="text" id="optionC" placeholder="選択肢 C" required />
            <label>選択肢C 画像URL:</label>
            <input id="optionCImageUrl" type="text" placeholder="https://..." />
            <label>選択肢C 画像ファイル:</label>
            <input id="optionCImageFile" type="file" accept="image/*" />
            <label>選択肢C 動画URL:</label>
            <input id="optionCVideoUrl" type="text" placeholder="https://..." />
            <label>選択肢C 動画ファイル:</label>
            <input id="optionCVideoFile" type="file" accept="video/*" />
          </div>
          <div class="form-group">
            <label for="optionD">選択肢 D:</label>
            <input type="text" id="optionD" placeholder="選択肢 D" required />
            <label>選択肢D 画像URL:</label>
            <input id="optionDImageUrl" type="text" placeholder="https://..." />
            <label>選択肢D 画像ファイル:</label>
            <input id="optionDImageFile" type="file" accept="image/*" />
            <label>選択肢D 動画URL:</label>
            <input id="optionDVideoUrl" type="text" placeholder="https://..." />
            <label>選択肢D 動画ファイル:</label>
            <input id="optionDVideoFile" type="file" accept="video/*" />
          </div>
          <div class="form-group">
            <label for="correctOption">正解の選択肢ID (A, B, C, D):</label>
            <input
              type="text"
              id="correctOption"
              placeholder="例: B"
              required
              pattern="[ABCD]"
            />
          </div>

          <input type="hidden" id="editingQuestionId" value="" />

          <div style="display: flex; gap: 10px">
            <button id="submitQuestionBtn" type="submit">問題を追加</button>
            <button id="cancelEditBtn" type="button" style="display: none">
              編集をキャンセル
            </button>
          </div>
        </form>

        <h3>既存の問題</h3>
        <div id="question-list">
          <p>問題がありません。</p>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="operator-admin.js"></script>
  </body>
</html>
