<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新郎新婦のラブがスゴいクイズGP - 参加者</title>
    <!-- 表示画面と同じテロップ風フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="participant.css">
</head>
<body>
    <div class="container">
        <h1 class="logo"><img src="/title/logo.png" alt="新郎新婦のラブがスゴいクイズGP"></h1>
        <p id="status">サーバーに接続中...</p>
        <div id="countdown-container">
            <div id="countdown"></div>
        </div>

        <div id="room-section" style="display: none;">
            <p>ルームIDを入力してください</p>
            <input type="text" id="roomIdInput" placeholder="ルームIDを入力">
            <button id="setRoomIdBtn">ルームに参加</button>
            <p class="hint">
                または、URLに ?roomId=ルームID を追加してください
            </p>
        </div>
        <div id="nickname-section">
            <p>ニックネームを入力してください</p>
            <input type="text" id="nicknameInput" placeholder="あなたのニックネーム">
            <button id="setNicknameBtn">参加</button>
        </div>

        <div id="question-area">
            <p id="question-text">問題が表示されます</p>
            <div id="options">
                <button class="option-button" data-option="A">選択肢 A</button>
                <button class="option-button" data-option="B">選択肢 B</button>
                <button class="option-button" data-option="C">選択肢 C</button>
                <button class="option-button" data-option="D">選択肢 D</button>
            </div>
        </div>
        <p id="feedback"></p>
        <p id="my-score">あなたの正解数: 0</p>
    </div>

    <!-- Socket.IOクライアントライブラリを読み込む -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- クライアント側のJavaScriptを読み込む -->
    <script src="client.js"></script>
</body>
</html>
